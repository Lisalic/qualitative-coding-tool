# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - qualitative-coding-tool

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run backend test suite
        run: python -m pytest -q

      # Send the repo root to Azure so the `backend/` package exists on disk for `from backend.app...` imports.
      # Dependency install is handled by Azure Oryx (SCM_DO_BUILD_DURING_DEPLOYMENT) on the server, not in this job.
      # Exclude any local venv dirs if present (e.g. optional local `antenv` under backend/).
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !backend/antenv/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService


  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1D1290F8CE4041C1B0B0539691233780 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5ADE32A7826F4249871428D2B93463EC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_963CF0ED07C84B4D99ACEAD85D921A78 }}

      # Azure startup command (App Service Configuration > General settings): run from artifact/repo root, e.g.
      #   python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
      # On Linux App Service, prefer the platform port when set: --port $PORT
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'qualitative-coding-tool'
          slot-name: 'Production'
